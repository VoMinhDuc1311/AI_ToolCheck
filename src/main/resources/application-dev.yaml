spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    enabled: true

ai:
  gemini:
    api-key: ${AI_GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta/models
    model: gemini-3.1-pro
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    primary-model: ${OLLAMA_PRIMARY_MODEL:qwen2.5-coder:7b}
    fallback-model: ${OLLAMA_FALLBACK_MODEL:qwen2.5-coder:7b}
    embed-model: ${OLLAMA_EMBED_MODEL:mxbai-embed-large}
    connect-timeout-seconds: 10
    # Reduced from 120s: qwen2.5-coder:7b + reduced context (ContextReducer) fits in 75s.
    # If using 30B model locally, increase to 120.
    read-timeout-seconds: 75

vector:
  datasource:
    # Đã cập nhật Port (5433), DB Name (ai_toolcheck), và Password (admin) khớp với Docker
    url: ${VECTOR_DB_URL:jdbc:postgresql://localhost:5433/ai_toolcheck}
    username: ${VECTOR_DB_USERNAME:postgres}
    password: ${VECTOR_DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

logging:
  level:
    root: WARN
    com.aitoolcheck: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/ai-toolcheck.log
    max-size: 10MB
    max-history: 30