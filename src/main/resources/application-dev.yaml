
  spring:
    datasource:
      url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver

      hikari:
        connection-timeout: 30000
        maximum-pool-size: 20
        minimum-idle: 10
        idle-timeout: 600000

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: false
      open-in-view: false
      properties:
        hibernate:
          format_sql: false

  server:
    port: ${SERVER_PORT:8080}
    servlet:
      context-path: /api

  springdoc:
    api-docs:
      path: /api-docs
    swagger-ui:
      enabled: false

  ai:
    gemini:
      api-key: ${AI_GEMINI_API_KEY}

  logging:
    level:
      root: WARN
      com.aitoolcheck: INFO
    pattern:
      console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

