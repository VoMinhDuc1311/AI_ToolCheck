spring:
  application:
    name: ai_toolcheck1_backend
  servlet:
    multipart:
      max-file-size: 70MB
      max-request-size: 70MB
  profiles:
    active: dev
  rabbitmq:
    listener:
      simple:
        prefetch: 1
        concurrency: 1

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

ai:
  optimization:
    enabled: true
    max-prompt-chars: 25000
    max-response-chars-to-store: 30000
    truncate-large-payload: true
    cache-enabled: true
    cache-ttl-minutes: 1440
    retry-enabled: true
    max-retries: 1
    retry-delay-ms: 1000

  batching:
    enabled: true
    default-max-items-per-batch: 5
    max-items-per-batch: 10
    max-chars-per-batch: 20000

  router:
    fallback-to-gemini: true
    fail-fast-local-provider: true
    provider-health-cache-seconds: 30

  runtime:
    enabled: false
    docker:
      enabled: false
      network: ai-toolcheck-network
    internal-port: 8080
    port-min: 18080
    port-max: 18999
    container-prefix: aitc-runtime
    public-host: 127.0.0.1
    build-timeout-seconds: 300
    start-timeout-seconds: 120
    health-timeout-seconds: 5
    max-active-runtimes: 5

  ollama:
    enabled: true
    health-timeout-ms: 3000
    connect-timeout-ms: 3000
    response-timeout-ms: 30000
    read-timeout-ms: 30000
    enrich-api-doc-timeout-seconds: 180
    generate-test-case-timeout-seconds: ${OLLAMA_GENERATE_TEST_CASE_TIMEOUT_SECONDS:180}

  gemini:
    enabled: true
    connect-timeout-ms: 5000
    response-timeout-ms: 45000
    api-key: ${AI_GEMINI_API_KEY:}

logging:
  level:
    root: WARN
    com.aitoolcheck: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET}
    access-token-minutes: ${APP_AUTH_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${APP_AUTH_REFRESH_TOKEN_DAYS:14}
    refresh-token-bytes: ${APP_AUTH_REFRESH_TOKEN_BYTES:64}
    seed-admin:
      enabled: ${APP_AUTH_SEED_ADMIN_ENABLED:false}
      email: ${APP_AUTH_SEED_ADMIN_EMAIL:}
      password: ${APP_AUTH_SEED_ADMIN_PASSWORD:}
      full-name: ${APP_AUTH_SEED_ADMIN_FULL_NAME:System Admin}

  # CORS allowed origins for the React/Vite frontend.
  # Vercel preview and production deployments use dynamic *.vercel.app origins.
  cors:
    allowed-origin-patterns:
      - http://localhost:5173
      - http://localhost:4173
      - http://localhost:3000
      - http://localhost:5500
      - http://localhost:63342
      - http://127.0.0.1:5173
      - http://127.0.0.1:4173
      - http://127.0.0.1:3000
      - http://127.0.0.1:5500
      - http://127.0.0.1:63342
      - https://*.vercel.app
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - Accept
      - Origin
      - X-Requested-With

github:
  check:
    # Connect timeout for GitHub API calls in milliseconds
    connect-timeout-ms: 5000
    # Read timeout for GitHub API calls in milliseconds
    read-timeout-ms: 8000
  import:
    # Connect timeout for GitHub ZIP download in milliseconds
    connect-timeout-ms: 5000
    # Read timeout for GitHub ZIP download in milliseconds
    read-timeout-ms: 30000

source:
  upload:
    # Maximum ZIP bytes accepted by upload/import pipeline
    max-zip-bytes: 73400320
    # Maximum regular files extracted from a ZIP
    max-file-count: 10000

test-run:
  stale:
    enabled: true
    pending-timeout-minutes: 30
    running-timeout-minutes: 120
