spring:
  application:
    name: ai_toolcheck1_backend
  profiles:
    active: dev

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    enabled: true

ai:
  gemini:
    api-key: ${AI_GEMINI_API_KEY:}

logging:
  level:
    root: WARN
    com.aitoolcheck: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"