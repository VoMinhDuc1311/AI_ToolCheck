spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 600000

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

server:
  port: 8080
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

ai:
  gemini:
    api-key: ${AI_GEMINI_API_KEY}
    base-url: ${AI_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
    model: ${AI_GEMINI_MODEL:gemini-2.5-flash}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
    primary-model: ${OLLAMA_PRIMARY_MODEL:qwen2.5-coder:7b}
    fallback-model: ${OLLAMA_FALLBACK_MODEL:qwen2.5-coder:7b}
    embed-model: ${OLLAMA_EMBED_MODEL:mxbai-embed-large}
    connect-timeout-seconds: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:10}
    # 90s: enough for qwen2.5-coder:7b with LegacySourceContextReducerService reduced input.
    # Override via env OLLAMA_READ_TIMEOUT_SECONDS if running a larger model.
    read-timeout-seconds: ${OLLAMA_READ_TIMEOUT_SECONDS:90}
    enrich-api-doc-timeout-seconds: ${OLLAMA_ENRICH_API_DOC_TIMEOUT_SECONDS:180}

logging:
  level:
    root: WARN
    com.aitoolcheck: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/ai-toolcheck.log
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
