spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 600000

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

server:
  port: 8080
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

ai:
  gemini:
    api-key: ${AI_GEMINI_API_KEY}
    base-url: ${AI_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
    model: ${AI_GEMINI_MODEL:gemini-2.5-flash}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
    primary-model: ${OLLAMA_PRIMARY_MODEL:qwen2.5-coder:7b}
    fallback-model: ${OLLAMA_FALLBACK_MODEL:qwen2.5-coder:7b}
    embed-model: ${OLLAMA_EMBED_MODEL:mxbai-embed-large}
    connect-timeout-seconds: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:10}
    # 90s: enough for qwen2.5-coder:7b with LegacySourceContextReducerService reduced input.
    # Override via env OLLAMA_READ_TIMEOUT_SECONDS if running a larger model.
    read-timeout-seconds: ${OLLAMA_READ_TIMEOUT_SECONDS:90}
    enrich-api-doc-timeout-seconds: ${OLLAMA_ENRICH_API_DOC_TIMEOUT_SECONDS:180}
    generate-test-case-timeout-seconds: ${OLLAMA_GENERATE_TEST_CASE_TIMEOUT_SECONDS:180}

logging:
  level:
    root: WARN
    com.aitoolcheck: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/ai-toolcheck.log
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

test-run:
  stale:
    enabled: ${TEST_RUN_STALE_ENABLED:true}
    pending-timeout-minutes: ${TEST_RUN_STALE_PENDING_TIMEOUT_MINUTES:30}
    running-timeout-minutes: ${TEST_RUN_STALE_RUNNING_TIMEOUT_MINUTES:120}

runtime:
  auto:
    enabled: ${RUNTIME_AUTO_ENABLED:false}
    docker-network: ${RUNTIME_AUTO_DOCKER_NETWORK:ai-toolcheck-runtime}
    internal-port: ${RUNTIME_AUTO_INTERNAL_PORT:8080}
    build-timeout-seconds: ${RUNTIME_AUTO_BUILD_TIMEOUT_SECONDS:300}
    startup-timeout-seconds: ${RUNTIME_AUTO_STARTUP_TIMEOUT_SECONDS:120}
    max-active-runtimes: ${RUNTIME_AUTO_MAX_ACTIVE_RUNTIMES:5}

# Schema compatibility migrator — runs at startup to ensure DB schema matches the Java model.
# This is the mechanism that converts source_file.file_type from MySQL ENUM to VARCHAR(50).
# Disable only if you have already applied the schema change manually and want to skip the check.
app:
  schema-compat:
    enabled: ${APP_SCHEMA_COMPAT_ENABLED:true}
