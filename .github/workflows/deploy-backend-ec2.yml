name: Deploy Backend Docker to EC2

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-ai-toolcheck-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vominhduc1311/ai-toolcheck-backend

jobs:
  build-and-push:
    name: Build Docker image and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Docker Compose stack on EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 20

    steps:
      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          DEPLOY_BRANCH: dev
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ai-toolcheck-ec2-key
          chmod 600 ~/.ssh/ai-toolcheck-ec2-key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          GHCR_TOKEN_B64="$(printf '%s' "$GHCR_TOKEN" | base64 -w 0)"

          ssh \
            -i ~/.ssh/ai-toolcheck-ec2-key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            -o TCPKeepAlive=yes \
            "$EC2_USER@$EC2_HOST" \
            "APP_DIR='$EC2_APP_DIR' BRANCH='$DEPLOY_BRANCH' IMAGE_REF='$IMAGE_REF' GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN_B64='$GHCR_TOKEN_B64' bash -s" << 'EOF'
          set -Eeuo pipefail

          ENV_FILE="/etc/ai-toolcheck.env"
          COMPOSE_FILE="$APP_DIR/docker-compose.prod.yml"

          echo "=== AI ToolCheck Docker deploy started ==="
          echo "APP_DIR=$APP_DIR"
          echo "BRANCH=$BRANCH"
          echo "IMAGE_REF=$IMAGE_REF"

          echo "=== [1/10] Navigate to app directory ==="
          cd "$APP_DIR"

          echo "=== [2/10] Fetch and reset to origin/$BRANCH ==="
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git reset --hard "origin/$BRANCH"

          echo "=== [3/10] Verify required files ==="
          test -f docker-compose.prod.yml || { echo "ERROR: docker-compose.prod.yml missing"; exit 1; }
          test -f "$ENV_FILE" || { echo "ERROR: $ENV_FILE missing on EC2"; exit 1; }

          echo "=== [4/10] Verify Docker and Docker Compose ==="
          sudo docker --version
          sudo docker compose version

          echo "=== [5/10] Verify required runtime env keys ==="
          sudo grep -q '^RABBITMQ_USERNAME=' "$ENV_FILE" || { echo "ERROR: RABBITMQ_USERNAME missing in $ENV_FILE"; exit 1; }
          sudo grep -q '^RABBITMQ_PASSWORD=' "$ENV_FILE" || { echo "ERROR: RABBITMQ_PASSWORD missing in $ENV_FILE"; exit 1; }

          echo "=== [6/10] Log in to GHCR on EC2 ==="
          printf '%s' "$GHCR_TOKEN_B64" | base64 -d | sudo docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

          echo "=== [7/10] Stop old systemd jar service to avoid port 8080 conflict ==="
          sudo systemctl stop ai-toolcheck || true
          sudo systemctl disable ai-toolcheck || true

          echo "=== [8/10] Remove old standalone RabbitMQ container if not compose-managed ==="
          if sudo docker ps -a --format '{{.Names}}' | grep -qx 'ai-toolcheck-rabbitmq'; then
            COMPOSE_SERVICE="$(sudo docker inspect ai-toolcheck-rabbitmq --format '{{ index .Config.Labels "com.docker.compose.service" }}' 2>/dev/null || true)"
            if [ "$COMPOSE_SERVICE" != "ai-toolcheck-rabbitmq" ]; then
              echo "Found old standalone ai-toolcheck-rabbitmq container. Removing it..."
              sudo docker stop ai-toolcheck-rabbitmq || true
              sudo docker rm ai-toolcheck-rabbitmq || true
            else
              echo "ai-toolcheck-rabbitmq is already compose-managed. Keeping it."
            fi
          fi

          echo "=== [9/10] Pull image and start Docker Compose stack ==="
          sudo env BACKEND_IMAGE="$IMAGE_REF" docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" pull ai-toolcheck-backend
          sudo env BACKEND_IMAGE="$IMAGE_REF" docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --no-build

          echo "=== Running containers ==="
          sudo docker ps

          echo "=== [10/10] Health check backend ==="
          echo "Waiting for backend actuator health..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/actuator/health | grep -q '"status"[[:space:]]*:[[:space:]]*"UP"'; then
              echo "Backend health OK"
              echo "=== AI ToolCheck Docker deploy completed successfully ==="
              exit 0
            fi

            echo "Backend not ready yet... attempt $i/30"
            sleep 5
          done

          echo "ERROR: Backend health check FAILED after 150 seconds"

          echo "=== Backend logs (last 200 lines) ==="
          sudo docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" logs --tail=200 ai-toolcheck-backend || true

          echo "=== RabbitMQ logs ==="
          sudo docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" logs --tail=80 ai-toolcheck-rabbitmq || true

          exit 1
          EOF
