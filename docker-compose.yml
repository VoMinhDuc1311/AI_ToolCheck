version: '3.8'

# ============================================================
# LOCAL DEVELOPMENT ONLY — Ollama services for local dev/testing
#
# This file is NOT used by GitHub Actions production deployment.
# Production deployment uses docker-compose.prod.yml exclusively.
#
# Usage (local):
#   docker compose up -d
# ============================================================

services:
  # ---------------------------------------------------------
  # OLLAMA SERVER — CPU-only (no NVIDIA/GPU for local dev)
  # ---------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    # No NVIDIA / GPU config — CPU-only for compatibility with EC2 t3.micro
    # and developer machines without NVIDIA GPU.
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # ---------------------------------------------------------
  # OLLAMA MODEL PULLER — Pulls required models once on startup
  # ---------------------------------------------------------
  ollama-pull-models:
    image: curlimages/curl:latest
    container_name: ollama-pull-models
    depends_on:
      - ollama
    restart: "no"
    command: >
      sh -c "
        echo 'Waiting for Ollama to start...'
        while ! curl -sf http://ollama:11434/ | grep -q 'Ollama is running'; do
          sleep 3
        done

        echo 'Ollama ready! Pulling qwen2.5-coder:7b...'
        curl -X POST http://ollama:11434/api/pull -d '{\"name\":\"qwen2.5-coder:7b\"}'

        echo 'Pulling mxbai-embed-large...'
        curl -X POST http://ollama:11434/api/pull -d '{\"name\":\"mxbai-embed-large\"}'

        echo 'Model pull complete!'
      "

volumes:
  ollama_data:
    name: ollama_data_volume
