name: ai-toolcheck-prod

networks:
  ai-toolcheck-network:
    name: ai-toolcheck-network
    driver: bridge

volumes:
  rabbitmq-data:
    name: ai-toolcheck-rabbitmq-data
  # Reuse the existing Ollama model volume from the old docker-compose.yml stack.
  # Using `external: true` ensures Docker does NOT delete models on `docker compose down`.
  ollama_data:
    external: true
    name: ollama_data_volume

services:
  # ---------------------------------------------------------
  # OLLAMA SERVER — CPU-only (EC2 t3.micro has no GPU)
  # ---------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    # No NVIDIA / GPU config — EC2 t3.micro is CPU-only
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-toolcheck-network
    healthcheck:
      # ollama/ollama image does NOT include curl — use the built-in CLI instead
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

  # ---------------------------------------------------------
  # OLLAMA MODEL PULLER — Pulls required models once on startup
  # ---------------------------------------------------------
  ollama-pull-models:
    image: curlimages/curl:latest
    container_name: ollama-pull-models
    depends_on:
      ollama:
        # curlimages/curl has its own wait-loop below — no need to block on health
        condition: service_started
    restart: "no"
    networks:
      - ai-toolcheck-network
    command: >
      sh -c "
        echo '=== Waiting for Ollama to be ready ==='
        while ! curl -sf http://ollama:11434/ | grep -q 'Ollama is running'; do
          echo 'Ollama not ready yet, waiting 5s...'
          sleep 5
        done

        echo '=== Pulling qwen2.5-coder:7b ==='
        curl -X POST http://ollama:11434/api/pull \
          -H 'Content-Type: application/json' \
          -d '{\"name\":\"qwen2.5-coder:7b\"}' \
          --no-buffer

        echo ''
        echo '=== Pulling mxbai-embed-large ==='
        curl -X POST http://ollama:11434/api/pull \
          -H 'Content-Type: application/json' \
          -d '{\"name\":\"mxbai-embed-large\"}' \
          --no-buffer

        echo ''
        echo '=== Model pull complete ==='
      "

  # ---------------------------------------------------------
  # RABBITMQ
  # ---------------------------------------------------------
  ai-toolcheck-rabbitmq:
    image: rabbitmq:3-management
    container_name: ai-toolcheck-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ai-toolcheck-network

  # ---------------------------------------------------------
  # BACKEND
  # ---------------------------------------------------------
  ai-toolcheck-backend:
    container_name: ai-toolcheck-backend
    image: ${BACKEND_IMAGE:-ghcr.io/vominhduc1311/ai-toolcheck-backend:dev}
    restart: unless-stopped
    env_file:
      - /etc/ai-toolcheck.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      SPRING_RABBITMQ_HOST: ai-toolcheck-rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      AI_RUNTIME_ENABLED: ${AI_RUNTIME_ENABLED:-true}
      AI_RUNTIME_DOCKER_ENABLED: ${AI_RUNTIME_DOCKER_ENABLED:-true}
      AI_RUNTIME_PORT_MIN: ${AI_RUNTIME_PORT_MIN:-18080}
      AI_RUNTIME_PORT_MAX: ${AI_RUNTIME_PORT_MAX:-18999}
      AI_RUNTIME_DOCKER_NETWORK: ${AI_RUNTIME_DOCKER_NETWORK:-ai-toolcheck-network}
      AI_RUNTIME_CONTAINER_PREFIX: ${AI_RUNTIME_CONTAINER_PREFIX:-aitc-runtime}
      AI_RUNTIME_PUBLIC_HOST: ${AI_RUNTIME_PUBLIC_HOST:-127.0.0.1}
      AI_RUNTIME_BUILD_TIMEOUT_SECONDS: ${AI_RUNTIME_BUILD_TIMEOUT_SECONDS:-300}
      AI_RUNTIME_START_TIMEOUT_SECONDS: ${AI_RUNTIME_START_TIMEOUT_SECONDS:-120}
      AI_RUNTIME_HEALTH_TIMEOUT_SECONDS: ${AI_RUNTIME_HEALTH_TIMEOUT_SECONDS:-5}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      ai-toolcheck-rabbitmq:
        condition: service_healthy
      ollama:
        # Backend connects to Ollama lazily at runtime via AiModelRouterService.
        # Blocking on service_healthy here would stall the deploy if Ollama is slow to start.
        condition: service_started
    networks:
      - ai-toolcheck-network
